<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>
</head>
<body>
    <script>
        let n = parseInt(prompt("Enter a number:"));
        let temp = n;
        let sum = 0;
        let rem;

        while (temp > 0) {
            rem = temp % 10;
            sum = sum + (rem * rem * rem);
            temp = parseInt(temp / 10);
        }

        if (sum == n) {
            document.write(n + " is an Armstrong number");
        } else {
            document.write(n + " is not an Armstrong number");
        }
    </script>
</body>
</html>
