<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>
    <script>
        function table(num) {
            for (let i = 1; i <= 10; i++) {
                document.write(num + " x " + i + " = " + (num * i) + "<br>");
            }
        }

        let n = parseInt(prompt("Enter a number:"));
        table(n);
    </script>
</body>
</html>
