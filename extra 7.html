<!DOCTYPE html>
<html>
<head>
    <title>Pyramid Structure</title>
</head>
<body>
    <script>
        let i = 1;

        while (i <= 5) {
            let j = 1;
            let star = "";

            while (j <= i) {
                star = star + "1 ";
                j++;
            }

            document.write(star + "<br>");
            i++;
        }
    </script>
</body>
</html>
