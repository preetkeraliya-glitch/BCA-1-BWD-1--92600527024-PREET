<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Shapes</title>

    <style>
        .circle {
            width: 100px;
            height: 100px;
            background-color: rgb(230, 9, 255);
            border-radius: 50px;
            margin: 20px;
        }

        .square {
            width: 100px;
            height: 100px;
            background-color: rgb(255, 0, 0);
            margin: 20px;
        }

        .rectangle {
            width: 150px;
            height: 100px;
            background-color: rgb(13, 0, 255);
            margin: 20px;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 100px solid rgb(204, 255, 0);
            margin: 20px;
        }
    </style>
</head>

<body align="center">

    <h1>Different Shapes</h1>

    <div class="circle"></div>
    <div class="square"></div>
    <div class="rectangle"></div>
    <div class="triangle"></div>

</body>
</html>.
