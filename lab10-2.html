<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #222;
        }
        .slide1 {
            z-index: 3;
            animation: slider1 9s infinite;
        }

        .slide2 {
            z-index: 2;
            animation: slider2 9s infinite;
        }

        .slide3 {
            z-index: 1;
            animation: slider3 9s infinite;
        }
        .slider {
            width: 800px;
            height: 450px;
            margin: 50px auto;
            position: relative;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
        }   
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .text {
            position: absolute;
            top: 40%;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 35px;
            font-weight: bold;
            z-index: 2;
            text-shadow: 2px 2px 5px black;
        } 
        @keyframes slider1 {
            0%, 30% { opacity: 1; }
            33%, 100% { opacity: 0; }
        }

        @keyframes slider2 {
            0%, 30% { opacity: 0; }
            33%, 63% { opacity: 1; }
            66%, 100% { opacity: 0; }
        }

        @keyframes slider3 {
            0%, 63% { opacity: 0; }
            66%, 96% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="slider">

        <div class="slide slide1">
            <img src="C:\7024 Preet\Switzerland.jpg">
            <div class="text">Welcome to My Website</div>
        </div>
        <div class="slide slide2">
            <img src="C:\7024 Preet\Dubai.jpg">
            <div class="text">Habibi Come to Dubai</div>
        </div>
        <div class="slide slide3">
            <img src="C:\7024 Preet\india.jpg">
            <div class="text">A Rahiyo Najaro</div>
        </div>

    </div>
</body>
</html>
