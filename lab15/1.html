<!DOCTYPE html>
<html>
<head>
    <title>Image Opacity Effect</title>

    <style>
        img {
            width: 400px;
            height: 500px;
            opacity: 1;
            transition: 0.5s;
        }

        img:hover {
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <h2>Mouse Over Image</h2>

    <img src="C:\7024 Preet\bmwm1.jpg" alt="My Image">

</body>
</html>
