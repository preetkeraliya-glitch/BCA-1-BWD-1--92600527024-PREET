<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
</head>
<body align="center">
    <h2>Registration</h2>
    <form>
        User Name :- <input type="text" name="username" placeholder="Enter Username..."/><br><br>
        Password :- <input type="password" name="password" placeholder="Enter Password..." /><br><br>
        Confom Password :- <input type="password" name="confom password" placeholder="Conformed Password..."/><br><br>
        Phone :- <input type="number" name="phone" placeholder="Enter Phone no..." /><br><br>
        Email :- <input type="text" name="email" placeholder="Enter Email..." /><br><br>
        Address :- <textarea rows="2" cols="20" placeholder="Enter Address..."></textarea><br><br>
        <input type="button" value="submit" name="login">
    </form>
    <a href="Login.html">
        <p>Login</p>
    </a>
</body>
</html>
