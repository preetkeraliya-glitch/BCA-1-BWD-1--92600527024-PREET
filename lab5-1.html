<!DOCTYPE html>
<html>
<head>
    <title>Clickable Image</title>
</head>

<body>
<h2>Poly</h2>    
<h2>Click on the BMW 🚗</h2>

<img src="C:\Users\student\Downloads\bmw-2.png"
     width="1261"
     height="706"
     usemap="#bmwmap">

<map name="bmwmap">
    <area shape="poly"
          coords="103,389,
                  110,286,
                  137,238,
                  225,185,
                  295,141,
                  415,103,
                  567,105,
                  690,112,
                  795,166,
                  863,211,
                  1056,231,
                  1127,276,
                  1154,454,
                  1118,472,
                  965,485,
                  675,473,
                  617,512,
                  545,497,
                  489,469,
                  226,446,
                  169,470,
                  103,407"
          href="https://www.bmw.com/"
          target="_blank"
          alt="BMW Car">

</map>
<hr><hr>
<h2>Circle</h2>
<h2>Click on Earth 🌍</h2>

<img src="C:\Users\student\Downloads\round.png"
     width="706"
     height="397"
     usemap="#earthmap">

<map name="earthmap">

    <!-- Only Earth is clickable -->
    <area shape="circle"
          coords="255,201,190"
          href="https://www.google.com/search?q=Earth"
          target="_blank"
          alt="Earth">

</map>
<hr><hr>
